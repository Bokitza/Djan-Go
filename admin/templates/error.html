{{define "content"}}
<div class="grid min-h-[60vh] place-items-center text-center">
  <div>
    <p class="text-sm font-semibold text-indigo-600 tabular-nums dark:text-indigo-400">{{.Page.Status}}</p>
    <h1 class="mt-2 text-3xl font-semibold tracking-tight">{{.Title}}</h1>
    <p class="mt-3 max-w-md text-sm text-zinc-500 dark:text-zinc-400">{{.Page.Message}}</p>
    <div class="mt-8 flex justify-center gap-3">
      <button type="button" onclick="history.back()" class="button button-secondary">{{icon "chevron-left"}} Go back</button>
      <a href="{{.Prefix}}/" class="button button-primary">Dashboard</a>
    </div>
  </div>
</div>
{{end}}
