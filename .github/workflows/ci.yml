name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    name: test (${{ matrix.database }})
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: djan
          POSTGRES_PASSWORD: djan
          POSTGRES_DB: djan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Empty runs the integration tests on SQLite files; a Postgres URL runs them on Postgres.
      DJAN_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://djan:djan@localhost:5432/djan?sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
