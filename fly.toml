# fly.toml app configuration file generated for djan-go on 2026-10-11T10:25:29+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'djan-go'
primary_region = 'fra'

[build]
  [build.args]
    GO_VERSION = '1.27.1'

[deploy]
  release_command = 'run-app migrate'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
