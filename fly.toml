# fly.toml app configuration file generated for djan-go on 2026-10-11T10:25:29+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'djan-go'
primary_region = 'fra'

[build]
  [build.args]
    GO_VERSION = '1.27.1'

# Migrations run at startup (see the Dockerfile CMD) rather than in a release_command, because a
# release machine doesn't have the volume holding the SQLite database.
# Backups: `fly storage create`, then set the DATABASE_BACKUP_URL secret (see the README).

[env]
  PORT = '8080'
  DATABASE_URL = 'sqlite:///data/app.db'

[mounts]
  source = 'djan_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
